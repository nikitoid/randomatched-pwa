  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('theme');
        var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        var roundness = localStorage.getItem('themeRoundness') || 'medium';
        document.documentElement.setAttribute('data-roundness', roundness);

        var bgPattern = localStorage.getItem('themeBgPattern');
        document.documentElement.setAttribute('data-bg-pattern', bgPattern !== null ? bgPattern : 'false');

        var cachedVars = localStorage.getItem('themeVariables');
        if (cachedVars) {
          var vars = JSON.parse(cachedVars);
          var root = document.documentElement;
          for (var key in vars) {
            if (vars.hasOwnProperty(key)) {
              root.style.setProperty(key, vars[key]);
            }
          }
        }
      } catch (e) {
        console.error('Theme early initialization failed', e);
      }
    })();
  </script>
  <link rel="stylesheet" href="/index.css">
